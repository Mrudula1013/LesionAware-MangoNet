[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lesionaware-mangonet"
version = "1.0.0"
description = "Reproducible lesion-aware CNN-Transformer mango leaf disease classification"
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
  "torch>=2.2,<3", "torchvision>=0.17,<1", "numpy>=1.24", "pillow>=10",
  "scipy>=1.10", "scikit-learn>=1.3", "pandas>=2.0", "PyYAML>=6.0",
  "opencv-python-headless>=4.8", "requests>=2.31", "tqdm>=4.66",
  "matplotlib>=3.7"
]
[project.optional-dependencies]
export = ["onnx>=1.16", "onnxruntime>=1.18"]
baselines = ["timm>=1.0"]
test = ["pytest>=8"]
profiling = ["fvcore>=0.1.5"]
all = ["onnx>=1.16", "onnxruntime>=1.18", "timm>=1.0", "pytest>=8", "fvcore>=0.1.5"]

[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
